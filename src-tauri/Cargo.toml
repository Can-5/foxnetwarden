[package]
name = "foxnetwarden"
version = "1.0.0"
edition = "2021"
description = "FoxNetwarden — local-first personal Linux desktop firewall"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
notify-rust = "4"

[build-dependencies]
tauri-build = "2"

[profile.release]
strip = true
lto = true
